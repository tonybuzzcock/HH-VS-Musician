name: Build and test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds attach the .vst to a GitHub Release

env:
  DSP_SRC: Source/DSP/Netlist.cpp Source/DSP/SpringTank.cpp Source/DSP/MusicianAmp.cpp
  VST_NAME: HH VS Musician (Reverb)
  VST_ZIP: HH-VS-Musician-Reverb-mac-vst.zip

jobs:
  linux-tests:
    name: DSP and plugin tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DSP tests (C++98)
        run: make -C Tests run CXX=g++

      - name: Plugin tests in a mini VST host
        run: make -C Tests vst-run CXX=g++

      - name: Upload demo renders
        uses: actions/upload-artifact@v4
        with:
          name: demo-renders
          path: Tests/renders/*.wav

  mac-vst:
    name: VS Musician (Reverb).vst for Mac OS X 10.8 (Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the bundle
        run: scripts/build_vst_mac.sh

      - name: Load the bundle in a mini VST host and test it
        run: |
          xcrun clang++ -arch x86_64 -mmacosx-version-min=10.8 -std=c++98 -stdlib=libc++ -O2 \
            Tests/vst_host_test.cpp $DSP_SRC -o build/vst_host_test
          build/vst_host_test "build/$VST_NAME.vst/Contents/MacOS/HHVSMusicianReverb"

      - name: Run the DSP test suite on Mac
        run: |
          xcrun clang++ -arch x86_64 -mmacosx-version-min=10.8 -std=c++98 -stdlib=libc++ -O2 \
            $DSP_SRC Tests/musician_test.cpp -o build/musician_test
          mkdir -p build/renders
          build/musician_test build/renders

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: HH-VS-Musician-Reverb-mac-vst
          path: build/${{ env.VST_ZIP }}

      - name: Attach to GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$VST_ZIP" \
            --title "HH VS Musician (Reverb) $GITHUB_REF_NAME" \
            --notes "VST 2.4 plugin, 64-bit Intel, Mac OS X 10.8 and later. Unzip and copy \"HH VS Musician (Reverb).vst\" to /Library/Audio/Plug-Ins/VST." \
          || gh release upload "$GITHUB_REF_NAME" "build/$VST_ZIP" --clobber
